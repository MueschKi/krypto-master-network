name: MTF – unabhängige Beobachtung

on:
  schedule:
    # Sechs Snapshots pro Tag, 37 Minuten nach dem 4h-Kerzenschluss (UTC).
    - cron: '37 0,4,8,12,16,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtf-snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository holen
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bibliotheken installieren
        run: python -m pip install -r requirements.txt
      - name: Gesamte Softwaretests einschließlich MTF und Betriebssicherheit
        run: python -m unittest discover -q
      - name: Frischen MTF-Snapshot erzeugen und im Summary anzeigen
        id: analyse
        run: python mtf_snapshot.py run "$RUNNER_TEMP/mtf-report"
      - name: Frische Berichte auch bei Daten- oder Ausführungsfehler sichern
        if: ${{ always() && steps.analyse.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: mtf-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mtf-report/ZEITFENSTER.md
            ${{ runner.temp }}/mtf-report/daten/zeitfenster_analysen.json
          if-no-files-found: error
          retention-days: 7
      - name: Nur MTF-Berichte sicher auf main speichern
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: python mtf_snapshot.py publish "$RUNNER_TEMP/mtf-report"
      - name: Fehlenden neuen Snapshot sichtbar machen
        if: ${{ failure() && steps.analyse.outcome == 'skipped' }}
        run: echo 'MTF nicht gestartet (Installation/Tests fehlgeschlagen). Kein neuer Snapshot; vorhandene Repository-Berichte sind ältere Ergebnisse.' >> "$GITHUB_STEP_SUMMARY"

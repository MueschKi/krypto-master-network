name: Phase A – Cloudflare read-only checks
on:
  pull_request:
    branches: [main]
    paths:
      [
        "cloudflare/**",
        "mtf_*.py",
        "net_timeframe_bot.py",
        "test_cloud_phase_a.py",
        "test_cloud_storage.py",
        "test_d1_backup.py",
        "test_d1_oauth_prepare.py",
        ".vscode/tasks.json",
        "test_backup_diagnostics.py",
        "test_wrangler_export_diagnostics.py",
        "test_d1_read_probe.py",
        "test_d1_read_backup_limits.py",
        ".github/workflows/cloudflare-d1-backup.yml",
        ".github/workflows/cloudflare-manual-deploy.yml",
        ".github/workflows/cloudflare-tests.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        working-directory: cloudflare
      - run: npm run test:wrangler-export-contract
        working-directory: cloudflare
      - run: npm run test:wrangler-oauth-contract
        working-directory: cloudflare
      - run: python cloudflare/scripts/d1_oauth_prepare.py rehearse
      - run: npm run check && npm test
        working-directory: cloudflare
      - run: npx playwright install --with-deps chromium webkit
        working-directory: cloudflare
      - run: npm run test:mobile
        working-directory: cloudflare
      - run: npx wrangler deploy --dry-run
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"

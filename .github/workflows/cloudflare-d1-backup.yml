name: D1 - encrypted backup and offline recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "read-probe = ein SELECT; diagnose = GET; backup = Export; recovery = offline"
        type: choice
        required: true
        default: recovery
        options: [recovery, backup, diagnose, read-probe]
      confirmation:
        description: "READ_ONLY_PROBE_KMN, DIAGNOSE_EXISTING_KMN, EXPORT_EXISTING_KMN oder OFFLINE_RECOVERY_ONLY"
        type: string
        required: true
      maintenance_confirmation:
        description: "Nur Backup: OWNER_CONFIRMED_MAINTENANCE (Pause bestehender Cron separat selbst freigegeben/ausgefuehrt)"
        type: string
        required: false
      source_run_id:
        description: "Nur Recovery: numerische Run-ID des erfolgreichen Backups, nicht Artifact-ID"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-kmn-maintenance
  cancel-in-progress: false

jobs:
  read-probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'MueschKi/krypto-master-network' && github.ref == 'refs/heads/main' && inputs.operation == 'read-probe' && inputs.confirmation == 'READ_ONLY_PROBE_KMN'
    environment: cloudflare-backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GET identity and exactly one fixed SELECT (no backup)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KMN_D1_DATABASE_ID: ${{ vars.KMN_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          umask 077
          python cloudflare/scripts/d1_backup_ci.py read-probe

  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'MueschKi/krypto-master-network' && github.ref == 'refs/heads/main' && inputs.operation == 'diagnose' && inputs.confirmation == 'DIAGNOSE_EXISTING_KMN'
    environment: cloudflare-backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Locked dependencies (no Actions cache)
        working-directory: cloudflare
        run: npm ci
      - name: Read-only metadata preflight (no export)
        working-directory: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KMN_D1_DATABASE_ID: ${{ vars.KMN_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/kmn-wrangler-config
        run: |
          set -euo pipefail
          umask 077
          python scripts/d1_backup_ci.py diagnose
      - name: Cleanup private diagnostics (never upload)
        if: always()
        run: |
          python - <<'PY_CLEANUP'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in root.glob('kmn-private-*'):
              shutil.rmtree(p, ignore_errors=True)
          shutil.rmtree(root/'kmn-wrangler-config', ignore_errors=True)
          PY_CLEANUP

  backup:
    if: github.repository == 'MueschKi/krypto-master-network' && github.ref == 'refs/heads/main' && inputs.operation == 'backup'
    environment: cloudflare-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Locked dependencies (no Actions cache)
        working-directory: cloudflare
        run: npm ci
      - name: Export, encrypt and verify both local restores
        working-directory: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KMN_D1_DATABASE_ID: ${{ vars.KMN_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
          BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          MAINTENANCE_CONFIRMATION: ${{ inputs.maintenance_confirmation }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/kmn-wrangler-config
        run: |
          set -euo pipefail
          umask 077
          python scripts/d1_backup_ci.py backup --publish-dir "$RUNNER_TEMP/kmn-ciphertext"
      - name: Upload only verified ciphertext (never plaintext)
        id: ciphertext_upload
        uses: actions/upload-artifact@v4
        with:
          name: kmn-encrypted-d1
          path: |
            ${{ runner.temp }}/kmn-ciphertext/backup.tar.gz.gpg
            ${{ runner.temp }}/kmn-ciphertext/ciphertext.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Safe upload failure classification
        if: failure() && steps.ciphertext_upload.outcome == 'failure'
        run: echo 'FAILED stage=ARTIFACT_UPLOAD'
      - name: Cleanup also after export/upload failure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for p in root.glob('kmn-private-*'):
              shutil.rmtree(p, ignore_errors=True)
          for name in ('kmn-ciphertext', 'kmn-wrangler-config'):
              shutil.rmtree(root/name, ignore_errors=True)
          PY

  recovery:
    if: github.repository == 'MueschKi/krypto-master-network' && github.ref == 'refs/heads/main' && inputs.operation == 'recovery'
    environment: cloudflare-backup
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download ciphertext and prove recovery without Cloudflare credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KMN_D1_DATABASE_ID: ${{ vars.KMN_D1_DATABASE_ID }}
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
          BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          umask 077
          python cloudflare/scripts/d1_backup_ci.py recovery --source-run-id "$SOURCE_RUN_ID"
      - name: Cleanup after recovery failure
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          for p in pathlib.Path(os.environ['RUNNER_TEMP']).glob('kmn-private-*'):
              shutil.rmtree(p, ignore_errors=True)
          PY

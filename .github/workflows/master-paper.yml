name: Krypto Master Network – Analyse, Paper und historische Diagnostik

on:
  schedule:
    # Zwei tägliche Termine; nur Paper Trading. GitHub kann verzögert starten.
    - cron: '17 4 * * *'
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Modus (echte Orders technisch gesperrt)'
        required: true
        type: choice
        default: demo
        options:
          - demo
          - analyse
          - paper
          - backtest-demo
          - backtest
          - diagnose-demo
          - diagnose
          - mtf-demo
          - mtf-analyse

permissions:
  contents: write

concurrency:
  group: ${{ startsWith(github.event.inputs.modus, 'mtf-') && 'mtf-snapshot-main' || format('master-paper-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository holen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Bibliotheken installieren
        run: python -m pip install -r requirements.txt
      - name: Alle Softwaretests einschließlich v1.4
        run: python -m unittest -q test_netzwerk test_trading test_master_backtest test_research_master test_trailing_v14 test_mtf test_mtf_schedule
      - name: Gewählten Modus ausführen
        shell: bash
        env:
          MODUS: ${{ github.event.inputs.modus || 'paper' }}
        run: |
          set -euo pipefail
          case "$MODUS" in
            demo|analyse|paper) python trading.py "$MODUS" | tee laufbericht.txt ;;
            backtest-demo) python backtest_master.py demo | tee laufbericht.txt ;;
            backtest) python backtest_master.py historisch | tee laufbericht.txt ;;
            diagnose-demo) python research_master.py demo | tee laufbericht.txt ;;
            diagnose) python research_master.py historisch | tee laufbericht.txt ;;
            mtf-demo) python mtf_analysis.py demo | tee laufbericht.txt ;;
            mtf-analyse) python mtf_analysis.py analyse | tee laufbericht.txt ;;
            *) echo 'Ungültiger Modus' >&2; exit 1 ;;
          esac
          {
            echo "## Master Network: $MODUS"
            echo '```text'
            cat laufbericht.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: MTF-Bericht in Zusammenfassung anzeigen
        if: ${{ success() && startsWith(github.event.inputs.modus, 'mtf-') }}
        shell: bash
        env:
          MODUS: ${{ github.event.inputs.modus }}
        run: |
          if [ "$MODUS" = mtf-demo ]; then
            cat DEMO_ZEITFENSTER.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat ZEITFENSTER.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: MTF-Berichte zum Download
        if: ${{ success() && startsWith(github.event.inputs.modus, 'mtf-') }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-timeframe-berichte
          path: |
            ${{ github.event.inputs.modus == 'mtf-demo' && 'DEMO_ZEITFENSTER.*' || 'ZEITFENSTER.md' }}
            ${{ github.event.inputs.modus == 'mtf-demo' && 'DEMO_ZEITFENSTER.json' || 'daten/zeitfenster_analysen.json' }}
          retention-days: 14
      - name: Nur Ergebnisse des angeforderten Modus speichern
        if: ${{ success() }}
        shell: bash
        env:
          MODUS: ${{ github.event.inputs.modus || 'paper' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          case "$MODUS" in
            mtf-analyse)
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                python mtf_snapshot.py publish .
              else
                echo 'MTF auf Nebenbranch: nur Summary und Artifact, kein Push auf main.'
              fi
              exit 0 ;;
            backtest)
              for p in BACKTEST_MASTER.md daten/master_backtest_kurve.csv daten/master_backtest_trades.csv; do
                if [ -f "$p" ]; then git add -- "$p"; fi
              done ;;
            diagnose)
              for p in DIAGNOSE_MASTER.md daten/master_v13_trades.csv daten/master_v13_entry.csv daten/master_v13_kurven.csv; do
                if [ -f "$p" ]; then git add -- "$p"; fi
              done ;;
            paper|analyse)
              for p in TRADING_STATUS.md TRAILING_STATUS.md VERGLEICH_MASTER.md NETZWERK.md daten/master_paper_state.json daten/master_trailing_state.json daten/netzwerk_analysen.json; do
                if [ -f "$p" ]; then git add -- "$p"; fi
              done ;;
            *) echo 'Nur Testmodus, keine Ergebnisspeicherung.' ;;
          esac
          if ! git diff --cached --quiet; then
            git commit -m "Master Network v1.4: $MODUS aktualisiert"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo 'Keine Änderungen an GitHub nötig.'
          fi
name: Cloudflare Phase A - manueller Test-Deploy

# Runs only on explicit user action; never on push, schedule or PR.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Nur Tests oder bewusster Deploy der read-only MTF-App"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deploy

permissions:
  contents: read

concurrency:
  group: cloudflare-phase-a-manual-deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    if: github.ref == 'refs/heads/main'
    name: Tests und optionaler manueller Cloudflare-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Code aus main laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bestehende Python-Tests
        run: |
          python -m pip install -r ../requirements.txt
          cd ..
          python -m unittest discover -q

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Dependencies und Cloudflare-Tests
        run: |
          npm ci
          npm run check
          npm test
          npx wrangler deploy --dry-run

      - name: D1-Binding nur fuer diesen Job konfigurieren
        if: inputs.operation == 'deploy'
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          database_id = os.environ.get("CF_D1_DATABASE_ID", "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", database_id):
              raise SystemExit("CF_D1_DATABASE_ID fehlt oder ist keine gueltige D1-UUID.")

          source = pathlib.Path("wrangler.toml").read_text(encoding="utf-8")
          old = 'database_id = "00000000-0000-0000-0000-000000000000"'
          if source.count(old) != 1:
              raise SystemExit("D1-Platzhalter fehlt oder ist nicht eindeutig; Deploy gestoppt.")

          pathlib.Path("wrangler.deploy.toml").write_text(
              source.replace(old, f'database_id = "{database_id}"'),
              encoding="utf-8",
          )
          PY

      - name: Cloudflare-Konfiguration sicher pruefen
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID fehlt oder hat ein ungueltiges Format."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "CLOUDFLARE_API_TOKEN fehlt als GitHub-Secret."
            exit 1
          fi

      - name: D1-Migrationen remote anwenden
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply kmn --remote --config wrangler.deploy.toml

      - name: Phase-A-App deployen
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy --config wrangler.deploy.toml
          echo "Phase A deployt: NUR MTF-Beobachtung, keine Paper-/Echtgeldorders."
          echo "UI bleibt ohne AUTH_USER und AUTH_PASSWORD (Cloudflare-Secrets) gesperrt."

name: Cloudflare Phase A - manueller Test-Deploy

# No automatic deployment. Only user-triggered on main.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "validate / diagnose (rein lesend), dann bootstrap, spaeter bewusst deploy"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - diagnose
          - bootstrap
          - deploy
      free_plan_confirmation:
        description: "Cloudflare Workers-Tarif im Dashboard selbst als Free bestaetigt? Wort FREE eingeben fuer bootstrap/deploy"
        type: string
        required: false
        default: ""
      deploy_confirmation:
        description: "Deploy ist technisch gesperrt; keine Bestaetigung entsperrt Migration/Worker"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-kmn-maintenance
  cancel-in-progress: false

jobs:
  cloudflare:
    if: github.ref == 'refs/heads/main'
    name: Tests und optionale Cloudflare-Einrichtung
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Deployment blocked pending current-data recovery gate
        if: inputs.operation == 'deploy'
        working-directory: ${{ runner.temp }}
        run: |
          echo "Deploy gesperrt: Backup/Recovery allein bestaetigt keinen unveraenderten Live-Datenstand. Migration und Veroeffentlichung brauchen ein separat geprueftes Gate und getrennte Freigaben."
          exit 1

      - name: main auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bestehende Python-Tests
        run: |
          python -m pip install -r ../requirements.txt
          cd ..
          python -m unittest discover -q

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Lokale Tests und Dry-Run
        run: |
          npm ci
          npm run check
          npm test
          npx wrangler deploy --dry-run

      - name: Free-Tarif vom Betreiber bestaetigen lassen
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        env:
          FREE_CONFIRMATION: ${{ inputs.free_plan_confirmation }}
        run: |
          if [[ "$FREE_CONFIRMATION" != "FREE" ]]; then
            echo "Abbruch: Vor Cloudflare-Ressourcenanlage den Workers Free-Tarif selbst im Dashboard pruefen und FREE bestaetigen."
            exit 1
          fi
          echo "Free-Tarif vom Betreiber manuell bestaetigt; kein automatischer Abo- oder Billing-Nachweis."

      - name: Cloudflare-Zugriff sicher diagnostizieren (nur lesend)
        if: inputs.operation == 'diagnose'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/diagnose_d1_ci.py

      - name: D1-Datenbank automatisch anlegen oder wiederverwenden
        if: inputs.operation == 'bootstrap'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/setup_d1_ci.py bootstrap

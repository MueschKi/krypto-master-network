name = "krypto-master-phase-a"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[triggers]
# One bounded symbol/timeframe unit each minute; retries on subsequent ticks.
crons = ["* * * * *"]
[[d1_databases]]
binding = "DB"
database_name = "kmn"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[observability]
enabled = true

# Assigned by Cloudflare to each published version; contains no secret.
[version_metadata]
binding = "CF_VERSION_METADATA"
